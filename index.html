```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-box {
            width: 350px;
            height: 480px;
            background: #ffffff;
            color: #222;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 25px #0005;
        }

        h2 {
            text-align: center;
            color: #5746e8;
            margin-top: 5px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .message {
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .user {
            background: #dcd8ff;
            text-align: right;
        }

        .ai {
            background: #eeeeee;
        }

        .input-area {
            display: flex;
            gap: 5px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 8px;
        }

        button {
            background: #5746e8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #392bb5;
        }
    </style>
</head>

<body>
    <div class="chat-box">
        <h2>🤖 My Simple AI</h2>

        <div id="messages">
            <div class="message ai">
                Hello! I am your mini AI. Ask me something! 😊
            </div>
        </div>

        <div class="input-area">
            <input id="userInput"
                   type="text"
                   placeholder="Type a message..."
                   autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById("userInput");
            const messages = document.getElementById("messages");
            const text = input.value.trim();

            if (text === "") return;

            messages.innerHTML +=
                `<div class="message user"></div>`;
            messages.lastElementChild.textContent = "You: " + text;

            let reply = getAIReply(text.toLowerCase());

            messages.innerHTML +=
                `<div class="message ai"></div>`;
            messages.lastElementChild.textContent = "AI: " + reply;

            input.value = "";
            messages.scrollTop = messages.scrollHeight;
        }

        function getAIReply(text) {
            if (text.includes("hello") || text.includes("hi")) {
                return "Hello! 😊 How can I help you?";
            }

            if (text.includes("your name")) {
                return "I am My Simple AI!";
            }

            if (text.includes("how are you")) {
                return "I am doing great! How are you?";
            }

            if (text.includes("time")) {
                return "The current time is " +
                    new Date().toLocaleTimeString();
            }

            if (text.includes("date")) {
                return "Today's date is " +
                    new Date().toLocaleDateString();
            }

            if (text.includes("html")) {
                return "HTML is used to create web pages.";
            }

            if (text.includes("bye")) {
                return "Goodbye! Have a nice day! 👋";
            }

            if (text.includes("help")) {
                return "You can ask me about my name, time, date, HTML, or say hello!";
            }

            return "I am still learning! Try asking me something else. 😊";
        }

        document.getElementById("userInput")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });
    </script>
</body>
</html>
